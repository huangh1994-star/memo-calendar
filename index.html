<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c62828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="备忘日历">
  <meta name="description" content="倒计时提醒、事件备忘、传统节日日历">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
  <title>提醒备忘日历</title>
</head>
<body>
  <div class="app-container">
    <!-- ===== 顶部导航栏 ===== -->
    <header class="app-header">
      <div class="header-top">
        <h1 class="app-title">📅 提醒备忘日历</h1>
        <div class="header-actions">
          <button class="btn btn-outline" id="btn-today">今天</button>
          <button class="btn btn-primary" id="btn-add-event">+ 添加</button>
        </div>
      </div>
      <div class="month-nav">
        <button class="btn-icon" id="btn-prev-month" title="上个月">◀</button>
        <span class="calendar-title" id="calendar-title"></span>
        <button class="btn-icon" id="btn-next-month" title="下个月">▶</button>
        <span class="year-display" id="year-display" style="font-size:0.8rem;color:var(--text-muted)"></span>
      </div>
    </header>

    <!-- ===== 星期头 ===== -->
    <div class="weekday-header">
      <div class="weekday-cell weekend">日</div>
      <div class="weekday-cell">一</div>
      <div class="weekday-cell">二</div>
      <div class="weekday-cell">三</div>
      <div class="weekday-cell">四</div>
      <div class="weekday-cell">五</div>
      <div class="weekday-cell weekend">六</div>
    </div>

    <!-- ===== 月历网格 ===== -->
    <div class="calendar-grid" id="calendar-grid"></div>

    <!-- ===== 倒计时区域 ===== -->
    <div class="countdown-section">
      <div class="section-title">⏳ 倒计时</div>
      <div id="countdown-list">
        <div class="empty-detail"><p>加载中...</p></div>
      </div>
    </div>

    <!-- ===== 日期详情面板 ===== -->
    <div class="date-detail-panel" id="date-detail">
      <div class="detail-header">
        <div class="detail-title" id="detail-title"></div>
        <button class="btn-icon" id="btn-close-detail" title="关闭">✕</button>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ===== 添加/编辑事件模态框 ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">添加事件</h2>
        <button class="btn-icon" id="btn-close-modal">✕</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="form-group">
          <label class="form-label" for="event-name">📝 事件名称 *</label>
          <input type="text" class="form-input" id="event-name"
                 placeholder="例如：结婚纪念日、生日、项目截止日..."
                 maxlength="50" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="event-start-date">📅 开始日期 *</label>
            <input type="date" class="form-input" id="event-start-date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="event-end-date">📅 结束日期</label>
            <input type="date" class="form-input" id="event-end-date">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="event-note">💬 备注</label>
          <textarea class="form-input form-textarea" id="event-note"
                    placeholder="可选的备注信息..."
                    maxlength="200" rows="2"></textarea>
        </div>
        <div class="toggle-group">
          <span class="toggle-label">🔄 每年重复</span>
          <label class="toggle-switch">
            <input type="checkbox" id="event-repeat">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="form-group" style="margin-top:16px;">
          <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary" style="flex:1;">
              💾 保存事件
            </button>
            <button type="button" class="btn btn-outline" id="btn-cancel" style="flex:1;">
              取消
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== JavaScript 模块（顺序加载） ===== -->
  <script src="./js/lunar.js"></script>
  <script src="./js/events.js"></script>
  <script src="./js/calendar.js"></script>
  <script src="./js/countdown.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
