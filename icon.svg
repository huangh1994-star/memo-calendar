<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 日历顶部色条 -->
  <rect x="0" y="0" width="512" height="120" rx="100" fill="#ff8a65" opacity="0.5"/>
  <rect x="0" y="60" width="512" height="60" fill="#ff8a65" opacity="0.5"/>
  <!-- 日历挂环 -->
  <circle cx="200" cy="55" r="25" fill="#fdf6f0"/>
  <circle cx="312" cy="55" r="25" fill="#fdf6f0"/>
  <!-- 日历主体 -->
  <rect x="56" y="100" width="400" height="370" rx="20" fill="white"/>
  <!-- 月份 -->
  <rect x="56" y="100" width="400" height="80" rx="20" fill="#ffcdd2"/>
  <rect x="56" y="160" width="400" height="20" fill="#ffcdd2"/>
  <text x="256" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#c62828">7月</text>
  <!-- 日期数字 -->
  <text x="256" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="140" font-weight="bold" fill="#333">25</text>
  <!-- 星期 -->
  <text x="256" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#999">星期六</text>
  <!-- 农历 -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#c62828">六月十二</text>
  <!-- 底部装饰点 -->
  <circle cx="196" cy="455" r="8" fill="#e53935"/>
  <circle cx="256" cy="455" r="8" fill="#ff8a65"/>
  <circle cx="316" cy="455" r="8" fill="#fdd835"/>
</svg>
